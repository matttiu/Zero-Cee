<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <title>404 — ZERO CEE</title>
  <link rel="icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: var(--gap);
    }
    .notfound-code {
      font-family: 'Space Mono', monospace;
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      text-shadow: 4px 4px 0 var(--bg), 8px 8px 0 var(--border-strong);
    }
    .notfound-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-mute);
      border: 1px solid var(--border);
      padding: 10px 18px 10px calc(18px + 0.4em);
    }
    .notfound p {
      color: var(--text-dim);
      font-weight: 300;
      max-width: 420px;
    }
  </style>
</head>
<body>

<main class="notfound">
  <div class="notfound-code" aria-hidden="true">404</div>
  <div class="notfound-label">No Signal</div>
  <p>This page doesn't exist — the track may have been moved or the link mistyped.</p>
  <a href="/" class="btn btn-primary">Back to Home</a>
</main>

</body>
</html>
