name: Check TLS certificate

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC (off the top of the hour on purpose: less queueing)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write             # only used to open/comment on the alert issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check origin + edge certificates
        id: check
        env:
          REPORT_FILE: cert-report.txt
          WARN_DAYS: '21'   # GitHub renews ~30 days out; <21 means renewal is failing
        run: bash .github/scripts/check-cert.sh

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo '```'
            cat cert-report.txt 2>/dev/null || echo 'no report produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open (or update) an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create cert-monitor --color B60205 \
            --description "Automated TLS certificate alert" 2>/dev/null || true
          {
            echo "The scheduled certificate check failed: $RUN_URL"
            echo
            echo '```'
            cat cert-report.txt 2>/dev/null || echo 'no report produced'
            echo '```'
            echo
            echo "IMPORTANT: Cloudflare SSL is Full (strict), so an expired origin certificate takes the site DOWN (error 526). Renewal needs http://<domain>/.well-known/acme-challenge/* to reach GitHub unredirected; the Cloudflare redirect rule \"HTTP to HTTPS (except ACME cert renewal)\" exempts that path and Bot Fight Mode must stay off. Usual fix: GitHub repo Settings > Pages > Remove the custom domain, re-add it, wait for the DNS check and certificate. Emergency only: set SSL/TLS mode to Full (not strict) until the certificate is issued, then switch back."
          } > issue-body.md
          existing="$(gh issue list --label cert-monitor --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "TLS certificate check failing" \
              --label cert-monitor --body-file issue-body.md
          fi
