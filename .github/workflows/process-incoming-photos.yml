name: Process incoming photos

on:
  push:
    branches: [main]
    paths: ['photos/incoming/**']
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two near-simultaneous uploads can't race each other
# and step on content/photos.json or pick the same photoN slot.
concurrency:
  group: process-incoming-photos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install sharp@0.33

      - name: Process incoming photos
        run: node .github/scripts/process-incoming-photos.mjs

      - name: Commit and push processed photos
        id: commit
        run: |
          git config user.name "Zero Cee Admin Bot"
          git config user.email "admin-bot@users.noreply.zerocee.ch"
          git add photos/ content/photos.json
          # Newly added webp files only (not the incoming/ deletions) — these
          # are what the next step waits on before the manifest cache is purged.
          NEW_PHOTOS=$(git diff --cached --name-only --diff-filter=A -- 'photos/*.webp')
          {
            echo "new_photos<<PHOTO_EOF"
            echo "$NEW_PHOTOS"
            echo "PHOTO_EOF"
          } >> "$GITHUB_OUTPUT"
          # [skip ci] is required: this commit deletes files under
          # photos/incoming/, which still matches this workflow's own
          # path filter and would otherwise re-trigger it in a loop.
          git diff --cached --quiet || git commit -m "Process incoming photo(s) [skip ci]"
          git pull --rebase
          git push

      # The manifest's Cloudflare cache gets purged right after this, so
      # visitors would otherwise see content/photos.json list a photo before
      # GitHub Pages has actually finished building and publishing it (a gap
      # observed to take up to ~80s), which briefly 404s in the gallery. Wait
      # until each new photo is actually reachable first.
      - name: Wait for new photos to go live
        if: success() && steps.commit.outputs.new_photos != ''
        run: |
          while IFS= read -r photo; do
            [ -z "$photo" ] && continue
            url="https://www.zerocee.ch/$photo"
            echo "Waiting for $url ..."
            live=0
            for i in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$status" = "200" ]; then
                echo "$url is live"
                live=1
                break
              fi
              sleep 5
            done
            [ "$live" = "1" ] || echo "::warning::$url still not live after 150s — purging anyway"
          done <<< "${{ steps.commit.outputs.new_photos }}"

      - name: Purge Cloudflare cache for photos.json
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not configured yet — skipping cache purge."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://www.zerocee.ch/content/photos.json"]}'
